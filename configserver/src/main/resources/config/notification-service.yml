server:
  port: 8084

spring:
#  application:
#    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificationdb}
    username: ${DB_USER:skabi}
    password: ${DB_PASSWORD:skabi}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          auto-create-topics: true
      bindings:
        springCloudBusInput:
          group: ${spring.application.name}-${server.port}
          binder: rabbit
        orderCreated-in-0:
          destination: order-created
          group: notification-order-created-group
          binder: kafka
        orderCancelled-in-0:
          destination: order-cancelled
          group: notification-order-cancelled-group
          binder: kafka
        orderShipped-in-0:
          destination: order-shipped
          group: notification-order-shipped-group
          binder: kafka
        orderDelivered-in-0:
          destination: order-delivered
          group: notification-order-delivered-group
          binder: kafka
        paymentCompleted-in-0:
          destination: payment-completed
          group: notification-payment-completed-group
          binder: kafka
        paymentFailed-in-0:
          destination: payment-failed
          group: notification-payment-failed-group
          binder: kafka
        refundCompleted-in-0:
          destination: refund-completed
          group: notification-refund-completed-group
          binder: kafka
        productBackInStock-in-0:
          destination: product-back-in-stock
          group: notification-backinstock-group
          binder: kafka

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    connection-timeout: 30000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.ecommerce.notification: DEBUG
