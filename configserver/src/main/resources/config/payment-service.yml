server:
  port: 8086

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
    username: ${DB_USER:skabi}
    password: ${DB_PASSWORD:skabi}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          auto-create-topics: true
      bindings:
        springCloudBusInput:
          group: ${spring.application.name}-${server.port}
          binder: rabbit
        inventoryReserved-in-0:
          destination: inventory-reserved
          group: payment-service-group
          binder: kafka
        orderCancelled-in-0:
          destination: order-cancelled
          group: payment-cancel-group
          binder: kafka
        paymentCompleted-out-0:
          destination: payment-completed
          binder: kafka
        paymentFailed-out-0:
          destination: payment-failed
          binder: kafka
        refundCompleted-out-0:
          destination: refund-completed
          binder: kafka

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    connection-timeout: 30000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.ecommerce.payment: DEBUG
