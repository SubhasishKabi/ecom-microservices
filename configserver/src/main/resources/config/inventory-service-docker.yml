server:
  port: 8087

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:inventorydb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
          auto-create-topics: true
      bindings:
        springCloudBusInput:
          group: ${spring.application.name}-${server.port}
          binder: rabbit
        orderCreated-in-0:
          destination: order-created
          group: inventory-service-group
          binder: kafka
        orderCancelled-in-0:
          destination: order-cancelled
          group: inventory-cancel-group
          binder: kafka
        paymentFailed-in-0:
          destination: payment-failed
          group: inventory-payment-failed-group
          binder: kafka
        paymentCompleted-in-0:
          destination: payment-completed
          group: inventory-payment-completed-group
          binder: kafka
        inventoryReserved-out-0:
          destination: inventory-reserved
          binder: kafka
        inventoryFailed-out-0:
          destination: inventory-failed
          binder: kafka
        inventoryReleased-out-0:
          destination: inventory-released
          binder: kafka
        productBackInStock-out-0:
          destination: product-back-in-stock
          binder: kafka

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 30000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,busrefresh
  endpoint:
    health:
      show-details: always
