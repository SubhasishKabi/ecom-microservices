<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>E-commerce microservices architecture</title>
<desc>A React frontend sends requests into a Dockerized backend containing four groups of services: Gateway and discovery (API Gateway, Eureka, Config Server), Business services (User, Product, Order), Saga participants (Inventory, Payment, Notification), and Data and messaging (Postgres, Kafka, RabbitMQ, Redis).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="390" fill="#ffffff"/>

<rect x="20" y="160" width="150" height="56" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.75"/>
<text x="95" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2c2c2a">Frontend</text>
<text x="95" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5f5e5a">React + Vite, :3000</text>
<line x1="170" y1="188" x2="198" y2="188" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="40" width="440" height="310" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="220" y="70" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Local docker compose environment</text>
<text x="220" y="88" dominant-baseline="central" font-size="12" fill="#444441">gateway :8080 is the single entry point</text>

<rect x="220" y="106" width="185" height="95" rx="12" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="312" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Gateway and discovery</text>
<text x="312" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">API Gateway, Eureka,</text>
<text x="312" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Config Server</text>

<rect x="425" y="106" width="185" height="95" rx="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="517" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Business services</text>
<text x="517" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">User, Product,</text>
<text x="517" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Order (cart + checkout)</text>

<rect x="220" y="217" width="185" height="95" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="312" y="245" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Saga participants</text>
<text x="312" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Inventory, Payment,</text>
<text x="312" y="281" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Notification</text>

<rect x="425" y="217" width="185" height="95" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="517" y="245" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Data and messaging</text>
<text x="517" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Postgres, Kafka,</text>
<text x="517" y="281" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">RabbitMQ, Redis</text>
</svg>
