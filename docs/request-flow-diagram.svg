<svg width="680" height="850" viewBox="0 0 680 850" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Checkout saga request flow</title>
<desc>A checkout request flows from the browser through the API gateway to the order service, which creates a pending order and publishes an order-created event. Inventory reserves stock and publishes inventory-reserved. Payment processes a mock charge and publishes payment-completed. The order service confirms the order and the notification service sends an in-app notification. A note at the bottom explains that a failure at any step cancels the order and releases stock.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="850" fill="#ffffff"/>

<rect x="200" y="40" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Add to cart, checkout</text>
<line x1="340" y1="96" x2="340" y2="156" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="156" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">API gateway</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Validates JWT, routes request</text>
<line x1="340" y1="212" x2="340" y2="272" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="272" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Order service</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Creates order: PENDING</text>
<line x1="340" y1="328" x2="340" y2="388" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495" y="358" dominant-baseline="central" font-size="12" fill="#5F5E5A">order-created</text>

<rect x="200" y="388" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Inventory service</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Reserves stock</text>
<line x1="340" y1="444" x2="340" y2="504" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495" y="474" dominant-baseline="central" font-size="12" fill="#5F5E5A">inventory-reserved</text>

<rect x="200" y="504" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Payment service</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Processes mock payment</text>
<line x1="340" y1="560" x2="340" y2="620" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495" y="590" dominant-baseline="central" font-size="12" fill="#5F5E5A">payment-completed</text>

<rect x="200" y="620" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Order service</text>
<text x="340" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Confirms order: CONFIRMED</text>
<line x1="340" y1="676" x2="340" y2="736" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="736" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="754" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Notification service</text>
<text x="340" y="772" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Sends notification and email</text>

<text x="340" y="822" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">On failure at any step, inventory is released and the order is cancelled</text>
</svg>
